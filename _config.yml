# Book settings
title: An Integrated Data Science Skill Pathway for Solving Real-World Problems in Economics and Business
author: College of Technology, National Economics University
copyright: "2025" 
logo: docs/logoNeu.jpg
exclude_patterns: ["cache"]

repository:
  url: https://github.com/NCT-NEU/Sach_Khoa_hoc_du_lieu_python
  path_to_book: ""
  branch: main  # Which branch of the repository should be used when creating links
  
latex:
  latex_documents:
    targetname: book.tex

# Execution settings
execute:
  execute_notebooks         : "cache"  # Whether to execute notebooks at build time. Must be one of ("auto", "force", "cache", "off")
  cache                     : "cache"

extra_css:
  - _static/css/custom.css

sphinx:
  recursive_update: true
  config:
    html_theme_options:
      show_prev_next: false

# HTML-specific settings
html:
  favicon                   : "docs/favicon2.png"  # A path to a favicon image
  navbar_number_sections    : false  # Add a number to each section in your left navbar
  use_edit_page_button      : false  # Whether to add an "edit this page" button to pages. If `true`, repository information in repository: must be filled in
  use_repository_button     : true  # Whether to add a link to your repository button
  use_issues_button         : false  # Whether to add an "open an issue" button
  extra_navbar              : <a href="nct.neu.edu.vn">TS. Nguyễn Quang Huy</a>  # Will be displayed underneath the left navbar.
  extra_footer              : ""  # Will be displayed underneath the footer.
  google_analytics_id       : ""  # A GA id that can be used to track book views.
  home_page_in_navbar       : true  # Whether to include your home page in the left Navigation Bar
  baseurl                   : "https://www.tomasbeuzen.com/python-programming-for-data-science/"  # The base URL where your book will be hosted. Used for creating image previews and social links. e.g.: https://mypage.com/mybook/
